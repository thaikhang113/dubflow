services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qwen-asr:
    environment:
      QWEN_ASR_DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vieneu:
    build:
      args:
        VIENEU_TORCH_INDEX: https://download.pytorch.org/whl/cu124
    environment:
      VIENEU_DEVICE: cuda
      VIENEU_ENABLE_CLONE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
