# =========================================================================
# nginx config cho VoxDub — MỘT domain, MỘT server block.
#
# Backend Node (cổng 3001) tự serve cả website (website/dist) lẫn API,
# nên nginx chỉ làm hai việc: TLS và proxy toàn bộ về 3001.
# Đổi domain = sửa server_name ở đây + PUBLIC_URL trong control_server/.env.
#
# Cách dùng trên VPS Windows:
#   1. Chép file này vào  C:\nginx\conf\voxdub.conf
#   2. Trong C:\nginx\conf\nginx.conf, bên trong khối  http { ... }  thêm:
#          include voxdub.conf;
#   3. Sửa server_name + 2 dòng ssl_certificate* cho đúng cert của bạn
#      (win-acme tạo — xem hướng dẫn kèm theo).
#   4. Kiểm tra rồi nạp lại:
#          cd C:\nginx
#          nginx -t
#          nginx -s reload
#
# (Test local KHÔNG cần nginx: chạy control_server rồi mở
#  http://localhost:3001 là có cả web lẫn API.)
# =========================================================================

# --- Cổng 80: chỉ phục vụ ACME (gia hạn cert) và đẩy sang HTTPS ----------
server {
    listen 80;
    server_name api.example.com;

    # win-acme gia hạn cert qua HTTP-01 — đường này phải đi lọt, không redirect.
    location /.well-known/acme-challenge/ {
        alias C:/nginx/acme/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Cổng 443: TLS + proxy toàn bộ về Node trên 127.0.0.1:3001 -----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    # >>> SỬA 2 DÒNG NÀY theo đường dẫn cert thật của win-acme trên VPS <<<
    ssl_certificate      C:/nginx/certs/api.example.com-chain.pem;
    ssl_certificate_key  C:/nginx/certs/api.example.com-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # Một lô 100 câu thoại kèm ngữ cảnh cỡ vài trăm KB. 4 MB khớp với
    # bodyLimit của Fastify — chặn ngay ở rìa, đỡ tốn RAM backend.
    client_max_body_size 4m;

    # Không cho lộ version nginx
    server_tokens off;

    # HSTS: trình duyệt/HTTP client luôn dùng HTTPS cho domain này
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Webhook thanh toán: KHÔNG BAO GIỜ cắt sớm ----------------------
    # PayOS bắn giao dịch về đây. Timeout ngắn ở đường này nghĩa là tiền
    # vào mà không sinh được key — sai lầm đắt nhất hệ thống có thể mắc.
    location /v1/billing/webhook/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Cổng AI: một lô dịch có thể mất vài phút ------------------------
    location /v1/ai/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout    360s;
        # Backend còn phải chờ mô hình nghĩ. Cắt ở 10s như các đường khác
        # thì mọi lô dịch lớn đều đứt giữa chừng.
        proxy_read_timeout    360s;
        proxy_buffering off;
    }

    # --- Phần còn lại: website + API thường (Node tự phân đường) ---------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Node cần IP thật của client để rate-limit đúng người
        # (đặt TRUST_PROXY=1 trong .env để Fastify đọc header này)
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Các đường này chỉ đọc MongoDB hoặc trả file tĩnh — nhanh.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 502 '{"code":"BACKEND_DOWN","message":"May chu dang khoi dong lai. Thu lai sau it phut."}';
    }
}
