name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0
      - name: Configure headless Qt
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build Linux bundle
        run: python scripts/build_linux.py --version "${{ steps.version.outputs.value }}"
      - name: Build Debian package
        run: python scripts/build_deb.py --no-build --version "${{ steps.version.outputs.value }}"
      - name: Validate Debian package
        shell: bash
        run: |
          set -euo pipefail
          package="dist/dubflow_${{ steps.version.outputs.value }}_amd64.deb"
          test -f "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -F "/opt/dubflow/DubFlow"
          dpkg-deb --contents "$package" | grep -F "/usr/share/applications/dubflow.desktop"
          test "$(dpkg-deb -f "$package" Package)" = "dubflow"
          test "$(dpkg-deb -f "$package" Architecture)" = "amd64"
      - name: Smoke installed Debian package
        shell: bash
        run: |
          set -euo pipefail
          package="dist/dubflow_${{ steps.version.outputs.value }}_amd64.deb"
          sudo apt-get install -y "$package"
          data_dir="$(mktemp -d)"
          sudo env QT_QPA_PLATFORM=offscreen AUTODUB_SMOKE=1 \
            DUBFLOW_DATA_DIR="$data_dir" /opt/dubflow/DubFlow
          python - "$data_dir/smoke_test_result.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report.get("ok") is True, report
          PY
      - name: Create checksum
        run: |
          (cd dist && sha256sum dubflow_*_amd64.deb) > dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/dubflow_*_amd64.deb
            dist/SHA256SUMS-linux.txt

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build Windows bundle
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_exe.py --no-zip --version "${{ steps.version.outputs.value }}"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" scripts\DubFlow.iss
      - name: Smoke installed Windows app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $installer = Get-ChildItem dist/DubFlow-v*-windows-x64-setup.exe |
            Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "DubFlow-smoke"
          $dataDir = Join-Path $env:RUNNER_TEMP "DubFlow-smoke-data"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $proc = Start-Process -FilePath $installer.FullName -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
              "/SP-", "/DIR=$installDir"
          if ($proc.ExitCode -ne 0) {
            throw "Installer failed with exit code $($proc.ExitCode)"
          }
          $env:AUTODUB_SMOKE = "1"
          $env:DUBFLOW_DATA_DIR = $dataDir
          & (Join-Path $installDir "DubFlow.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "Installed app smoke failed with exit code $LASTEXITCODE"
          }
          $report = Get-Content (Join-Path $dataDir "smoke_test_result.json") |
            ConvertFrom-Json
          if (-not $report.ok) {
            throw "Installed app smoke report failed"
          }
      - name: Create checksum
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/DubFlow-v*-windows-x64-setup.exe
          (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $archive.Name |
            Set-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/DubFlow-v*-windows-x64-setup.exe
            dist/SHA256SUMS-windows.txt

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "DubFlow $tag" \
              --generate-notes
          fi
