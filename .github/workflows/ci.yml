name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0
      - name: Configure headless Qt
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest.xml
            pytest.log

  build-linux:
    name: Build / Linux x86_64
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Resolve version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build Linux bundle
        run: python scripts/build_linux.py --no-test --version "${{ steps.version.outputs.value }}"
      - name: Build Debian package
        run: python scripts/build_deb.py --no-build --version "${{ steps.version.outputs.value }}"
      - name: Validate Debian package
        run: |
          set -euo pipefail
          package="dist/dubflow_${{ steps.version.outputs.value }}_amd64.deb"
          test -f "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -F "/opt/dubflow/DubFlow"
          dpkg-deb --contents "$package" | grep -F "/usr/share/applications/dubflow.desktop"
          test "$(dpkg-deb -f "$package" Package)" = "dubflow"
          test "$(dpkg-deb -f "$package" Architecture)" = "amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: DubFlow-linux-amd64
          path: dist/dubflow_*_amd64.deb

  build-windows:
    name: Build / Windows x64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build Windows bundle
        run: python scripts/build_exe.py --no-test --no-zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found"
          }
          & $iscc scripts\DubFlow.iss
      - uses: actions/upload-artifact@v4
        with:
          name: DubFlow-windows-x64
          path: dist/DubFlow-v*-windows-x64-setup.exe
