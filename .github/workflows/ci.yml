name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0
      - name: Configure headless Qt
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest.xml
            pytest.log

  build-linux:
    name: Build / Linux x86_64
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Resolve version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build Linux bundle
        run: python scripts/build_linux.py --version "${{ steps.version.outputs.value }}"
      - name: Build Debian package
        run: python scripts/build_deb.py --no-build --version "${{ steps.version.outputs.value }}"
      - name: Validate Debian package
        run: |
          set -euo pipefail
          package="dist/dubflow_${{ steps.version.outputs.value }}_amd64.deb"
          test -f "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -F "/opt/dubflow/DubFlow"
          dpkg-deb --contents "$package" | grep -F "/usr/share/applications/dubflow.desktop"
          test "$(dpkg-deb -f "$package" Package)" = "dubflow"
          test "$(dpkg-deb -f "$package" Architecture)" = "amd64"
      - name: Smoke installed Debian package
        run: |
          set -euo pipefail
          package="dist/dubflow_${{ steps.version.outputs.value }}_amd64.deb"
          sudo apt-get install -y "./$package"
          data_dir="$(mktemp -d)"
          sudo env QT_QPA_PLATFORM=offscreen AUTODUB_SMOKE=1 \
            DUBFLOW_DATA_DIR="$data_dir" /opt/dubflow/DubFlow
          python - "$data_dir/smoke_test_result.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report.get("ok") is True, report
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DubFlow-linux-amd64
          path: dist/dubflow_*_amd64.deb

  build-windows:
    name: Build / Windows x64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build Windows bundle
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_exe.py --no-zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found"
          }
          & $iscc scripts\DubFlow.iss
      - name: Smoke installed Windows app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $installer = Get-ChildItem dist/DubFlow-v*-windows-x64-setup.exe |
            Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "DubFlow-smoke"
          $dataDir = Join-Path $env:RUNNER_TEMP "DubFlow-smoke-data"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $proc = Start-Process -FilePath $installer.FullName -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
              "/SP-", "/DIR=$installDir"
          if ($proc.ExitCode -ne 0) {
            throw "Installer failed with exit code $($proc.ExitCode)"
          }
          $env:AUTODUB_SMOKE = "1"
          $env:DUBFLOW_DATA_DIR = $dataDir
          $appProc = Start-Process -FilePath (Join-Path $installDir "DubFlow.exe") `
            -Wait -PassThru
          if ($appProc.ExitCode -ne 0) {
            throw "Installed app smoke failed with exit code $($appProc.ExitCode)"
          }
          $report = Get-Content (Join-Path $dataDir "smoke_test_result.json") |
            ConvertFrom-Json
          if (-not $report.ok) {
            throw "Installed app smoke report failed"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DubFlow-windows-x64
          path: dist/DubFlow-v*-windows-x64-setup.exe
