name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Configure headless Qt
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest.xml
            pytest.log

  build-linux:
    name: Build / Linux x86_64
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build Linux bundle
        run: python scripts/build_linux.py --no-test --version 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: DubFlow-linux-x86_64
          path: dist/DubFlow-v*-linux-x86_64.tar.gz

  build-windows:
    name: Build / Windows x64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Build Windows bundle
        run: python scripts/build_exe.py --no-test --no-zip
      - uses: actions/upload-artifact@v4
        with:
          name: DubFlow-windows-x64
          path: dist/DubFlow
