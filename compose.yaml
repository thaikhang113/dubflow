services:
  tool:
    build:
      context: .
    image: auto-vietsub-tool:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18793:18793"
    environment:
      TOOL_ROOT: /data
      TOOL_BIND_HOST: 0.0.0.0
      TOOL_BIND_PORT: "18793"
      OLLAMA_HOST_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tool-data:/data/data
      - tool-secrets:/data/secrets
      - tool-jobs:/data/jobs
      - tool-output:/data/output
      - tool-models:/data/models
      - tool-browser:/data/browser
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5m

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  trend-db:
    image: postgres:17-bookworm
    profiles: ["trend"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: trend_scout
      POSTGRES_USER: trend_scout
      POSTGRES_PASSWORD_FILE: /run/secrets/trend-db-password
    secrets:
      - trend-db-password
    volumes:
      - trend-db-data:/var/lib/postgresql/data

secrets:
  trend-db-password:
    file: ${TREND_DB_PASSWORD_FILE:-./.tool-secrets/trend-db-password.txt}

volumes:
  tool-data:
  tool-secrets:
  tool-jobs:
  tool-output:
  tool-models:
  tool-browser:
  ollama-models:
  trend-db-data:
