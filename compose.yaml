services:
  tool:
    build:
      context: .
    image: auto-vietsub-tool:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TOOL_PORT:-18793}:18793"
    environment:
      TOOL_ROOT: /data
      TOOL_BIND_HOST: 0.0.0.0
      TOOL_BIND_PORT: "18793"
      OLLAMA_API_BASE: http://host.docker.internal:11434
      NINEROUTER_API_BASE: http://host.docker.internal:20128/v1
      OCR_VISION_API_BASE: http://host.docker.internal:20128/v1
      AI33_API_BASE: https://api.ai33.pro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tool-data:/data/data
      - tool-secrets:/data/secrets
      - tool-jobs:/data/jobs
      - tool-output:/data/output
      - tool-models:/data/models
      - tool-browser:/data/browser
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5m

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: "no"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  qwen-asr:
    build:
      context: ./services/qwen_asr
    image: auto-vietsub-qwen-asr:local
    profiles: ["local-ai"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18795:8000"
    environment:
      QWEN_ASR_BIND_HOST: 0.0.0.0
      QWEN_ASR_BIND_PORT: "8000"
      QWEN_ASR_MODELS_DIR: /models
      QWEN_ASR_JOBS_DIR: /data/jobs
    volumes:
      - qwen-asr-models:/models
      - tool-jobs:/data/jobs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 30s

  vieneu:
    build:
      context: ./services/vieneu_tts
    image: auto-vietsub-vieneu:local
    profiles: ["local-ai"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18796:8000"
    environment:
      VIENEU_BIND_HOST: 0.0.0.0
      VIENEU_BIND_PORT: "8000"
      VIENEU_MODELS_DIR: /models
    volumes:
      - vieneu-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 30s

  trend-db:
    image: postgres:17-bookworm
    profiles: ["trend"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: trend_scout
      POSTGRES_USER: trend_scout
      POSTGRES_PASSWORD_FILE: /run/secrets/trend-db-password
    secrets:
      - trend-db-password
    volumes:
      - trend-db-data:/var/lib/postgresql/data

secrets:
  trend-db-password:
    file: ${TREND_DB_PASSWORD_FILE:-./.tool-secrets/trend-db-password.txt}

volumes:
  tool-data:
  tool-secrets:
  tool-jobs:
  tool-output:
  tool-models:
  tool-browser:
  ollama-models:
  qwen-asr-models:
  vieneu-models:
  trend-db-data:
